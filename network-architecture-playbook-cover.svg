<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Network Architecture Playbook</title><desc id="desc">A detailed enterprise network reference architecture showing users, edge security, campus, data centre, cloud, WAN, segmentation, routing, observability and zero trust controls.</desc>
