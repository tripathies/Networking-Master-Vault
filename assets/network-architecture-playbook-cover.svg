<!-- Learning stage cards: chamfered polygon panels -->
<g>
 <path class="card" stroke="#24cfff" d="M590 400L630 370H970L1010 410V650L970 690H630L590 650Z"/>
 <circle cx="650" cy="430" r="30" fill="#087cc5" stroke="#79edff" stroke-width="3"/><text x="650" y="441" text-anchor="middle" class="num">01</text>
 <text x="700" y="435" class="stage">NETWORKING FUNDAMENTALS</text>
 <text x="630" y="482" class="topic">✓ What is a network? • LAN / MAN / WAN / PAN</text><text x="630" y="513" class="topic">✓ OSI 7-layer and TCP/IP models</text><text x="630" y="544" class="topic">✓ Ethernet • Wi-Fi • topology • media</text><text x="630" y="575" class="topic">✓ Frames • packets • ports • protocols</text><text x="630" y="606" class="topic">✓ MAC • NIC • bandwidth • latency • jitter</text><text x="630" y="652" class="small">OUTCOME  Explain how data travels between hosts</text>
</g>
<g>
 <path class="card" stroke="#21d4bc" d="M1070 520L1110 490H1460L1500 530V770L1460 810H1110L1070 770Z"/>
 <circle cx="1130" cy="550" r="30" fill="#078e83" stroke="#8affeb" stroke-width="3"/><text x="1130" y="561" text-anchor="middle" class="num">02</text>
 <text x="1180" y="555" class="stage">COMMAND LINE &amp; TOOLS</text>
 <text x="1110" y="602" class="topic">✓ ping • traceroute • ipconfig • ip</text><text x="1110" y="633" class="topic">✓ nslookup • dig • arp • route • ss</text><text x="1110" y="664" class="topic">✓ Wireshark • tcpdump • packet capture</text><text x="1110" y="695" class="topic">✓ SSH • PuTTY • terminal workflows</text><text x="1110" y="736" class="small">OUTCOME  Test and investigate connectivity</text>
</g>
<g>
 <path class="card" stroke="#63dc68" d="M1110 850L1150 820H1490L1530 860V1100L1490 1140H1150L1110 1100Z"/>
 <circle cx="1170" cy="880" r="30" fill="#238c42" stroke="#a2ff9c" stroke-width="3"/><text x="1170" y="891" text-anchor="middle" class="num">03</text>
 <text x="1220" y="885" class="stage">NETWORK DEVICES</text>
 <text x="1150" y="932" class="topic">✓ Hubs • repeaters • bridges • switches</text><text x="1150" y="963" class="topic">✓ Routers • wireless APs • controllers</text><text x="1150" y="994" class="topic">✓ Firewalls • load balancers • modems / ONTs</text><text x="1150" y="1025" class="topic">✓ Copper • fibre • optics • racks • UPS</text><text x="1150" y="1066" class="small">OUTCOME  Select devices for a network design</text>
</g>
<g>
 <path class="card" stroke="#f2cf43" d="M1070 1190L1110 1160H1460L1500 1200V1440L1460 1480H1110L1070 1440Z"/>
 <circle cx="1130" cy="1220" r="30" fill="#a77a08" stroke="#fff19a" stroke-width="3"/><text x="1130" y="1231" text-anchor="middle" class="num">04</text>
 <text x="1180" y="1225" class="stage">IP ADDRESSING &amp; SUBNETTING</text>
 <text x="1110" y="1272" class="topic">✓ Binary • IPv4 • IPv6 • address classes</text><text x="1110" y="1303" class="topic">✓ CIDR • subnet masks • network / host IDs</text><text x="1110" y="1334" class="topic">✓ Subnetting • VLSM • route summarisation</text><text x="1110" y="1365" class="topic">✓ Gateways • DHCP • DNS • IPAM</text><text x="1110" y="1406" class="small">OUTCOME  Build a scalable addressing plan</text>
</g>
<g>
 <path class="card" stroke="#ff9c38" d="M590 1510L630 1480H970L1010 1520V1760L970 1800H630L590 1760Z"/>
 <circle cx="650" cy="1540" r="30" fill="#b75b10" stroke="#ffd39a" stroke-width="3"/><text x="650" y="1551" text-anchor="middle" class="num">05</text>
 <text x="700" y="1545" class="stage">SWITCHING &amp; ROUTING</text>
 <text x="630" y="1592" class="topic">✓ VLANs • trunking • STP / RSTP • LACP</text><text x="630" y="1623" class="topic">✓ Inter-VLAN routing • ARP / ND • VRF</text><text x="630" y="1654" class="topic">✓ Static routes • OSPF • BGP • ECMP</text><text x="630" y="1685" class="topic">✓ TCP / UDP • ICMP • DNS • DHCP • TLS</text><text x="630" y="1726" class="small">OUTCOME  Explain and control traffic paths</text>
</g>
<g>
 <path class="card" stroke="#ff5d72" d="M110 1190L150 1160H500L540 1200V1440L500 1480H150L110 1440Z"/>
 <circle cx="170" cy="1220" r="30" fill="#a51f40" stroke="#ffb0bd" stroke-width="3"/><text x="170" y="1231" text-anchor="middle" class="num">06</text>
 <text x="220" y="1225" class="stage">NETWORK SECURITY</text>
 <text x="150" y="1272" class="topic">✓ Firewalls • zones • ACLs • security policy</text><text x="150" y="1303" class="topic">✓ NAT / PAT • VPN • remote access</text><text x="150" y="1334" class="topic">✓ IDS / IPS • threat detection • segmentation</text><text x="150" y="1365" class="topic">✓ Zero Trust • secure network design</text><text x="150" y="1406" class="small">OUTCOME  Protect traffic and trust boundaries</text>
</g>
<g>
 <path class="card" stroke="#b77bff" d="M70 850L110 820H450L490 860V1100L450 1140H110L70 1100Z"/>
 <circle cx="130" cy="880" r="30" fill="#6337a9" stroke="#d9baff" stroke-width="3"/><text x="130" y="891" text-anchor="middle" class="num">07</text>
 <text x="180" y="885" class="stage">WIRELESS NETWORKING</text>
 <text x="110" y="932" class="topic">✓ WLAN • 802.11 standards • RF basics</text><text x="110" y="963" class="topic">✓ Channels • roaming • coverage • capacity</text><text x="110" y="994" class="topic">✓ AP design • authentication • WLAN security</text><text x="110" y="1025" class="topic">✓ Wireless troubleshooting methodology</text><text x="110" y="1066" class="small">OUTCOME  Design and troubleshoot Wi-Fi</text>
</g>
<g>
 <path class="card" stroke="#4f9dff" d="M100 520L140 490H490L530 530V770L490 810H140L100 770Z"/>
 <circle cx="160" cy="550" r="30" fill="#1c5eb0" stroke="#a9d4ff" stroke-width="3"/><text x="160" y="561" text-anchor="middle" class="num">08</text>
 <text x="210" y="555" class="stage">CLOUD &amp; HYBRID NETWORKING</text>
 <text x="140" y="602" class="topic">✓ AWS VPC • Azure VNet • Google Cloud VPC</text><text x="140" y="633" class="topic">✓ Subnets • route tables • gateways • peering</text><text x="140" y="664" class="topic">✓ Security groups • NSGs • cloud firewalls</text><text x="140" y="695" class="topic">✓ VPN • Direct Connect • ExpressRoute • Interconnect</text><text x="140" y="736" class="small">OUTCOME  Connect cloud and on-prem environments</text>
</g>
<g>
 <path class="card" stroke="#25cfff" d="M100 1510L140 1480H490L530 1520V1760L490 1800H140L100 1760Z"/>
 <circle cx="160" cy="1540" r="30" fill="#126aa8" stroke="#a5f2ff" stroke-width="3"/><text x="160" y="1551" text-anchor="middle" class="num">09</text>
 <text x="210" y="1545" class="stage">DATA CENTRE &amp; MODERN NETWORKS</text>
 <text x="140" y="1592" class="topic">✓ Spine-leaf • overlays • VXLAN / EVPN</text><text x="140" y="1623" class="topic">✓ SD-WAN • branch • WAN optimisation</text><text x="140" y="1654" class="topic">✓ Docker • Kubernetes • CNI • ingress / egress</text><text x="140" y="1685" class="topic">✓ Load balancing • service discovery • resilience</text><text x="140" y="1726" class="small">OUTCOME  Understand modern platform networking</text>
</g>
<g>
 <path class="card" stroke="#e45be5" d="M590 1830L630 1800H970L1010 1840V2000L970 2040H630L590 2000Z"/>
 <circle cx="650" cy="1860" r="30" fill="#8a2e9b" stroke="#f4b3ff" stroke-width="3"/><text x="650" y="1871" text-anchor="middle" class="num">10</text>
 <text x="700" y="1865" class="stage">OPERATIONS &amp; ARCHITECTURE</text>
 <text x="630" y="1912" class="topic">✓ SNMP • NetFlow • telemetry • observability</text><text x="630" y="1943" class="topic">✓ Performance • capacity • fault management</text><text x="630" y="1974" class="topic">✓ Python • Ansible • APIs • automation</text><text x="630" y="2005" class="topic">✓ Enterprise design • documentation • DR</text>
</g>
