<g filter="url(#shadow)" fill="none" stroke="#32d9ff" stroke-width="3" opacity=".9"><circle cx="1370" cy="190" r="74"/><ellipse cx="1370" cy="190" rx="34" ry="74"/><ellipse cx="1370" cy="190" rx="74" ry="29"/><path d="M1298 190H1442M1370 116V264M1317 137L1423 243M1423 137L1317 243"/></g>
