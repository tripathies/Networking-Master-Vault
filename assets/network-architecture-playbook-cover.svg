<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2190" viewBox="0 0 1600 2190" role="img" aria-labelledby="title desc">
<title id="title">Networking Zero to Hero — complete learning and teaching roadmap</title>
<desc id="desc">Ten progressive stages from networking fundamentals and command-line tools to network devices, IP addressing, switching, routing, security, wireless, troubleshooting, AWS Azure Google Cloud, hybrid networks, data centres, containers, automation and enterprise architecture. Each stage includes study topics, tools and an outcome.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#06172c"/><stop offset=".55" stop-color="#0b2b48"/><stop offset="1" stop-color="#061326"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#4ca6d0" stroke-opacity=".12"/></pattern></defs>
<rect width="1600" height="2190" fill="url(#bg)"/><rect width="1600" height="2190" fill="url(#grid)"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="70" y="92" font-size="27" font-weight="700" fill="#a9eaff" letter-spacing="5">NETWORKING LEARNING SERIES</text>
<text x="70" y="185" font-size="82" font-weight="900" fill="#fff">ZERO TO HERO</text>
<text x="74" y="239" font-size="28" font-weight="700" fill="#6be4ff">FROM FIRST PACKET TO ENTERPRISE &amp; CLOUD ARCHITECTURE</text>
<text x="75" y="282" font-size="19" fill="#d0e7f6">A structured teaching roadmap • 10 learning stages • 100 linked topic guides</text>
<rect x="42" y="300" width="1516" height="4" rx="2" fill="#27c7f2"/>
<g><rect x="42" y="330" width="1516" height="165" rx="15" fill="#f4f8fc" stroke="#148ed5" stroke-width="3"/><rect x="42" y="330" width="150" height="165" rx="14" fill="#148ed5"/><text x="117" y="421" text-anchor="middle" font-size="50" font-weight="900" fill="#fff">01</text><text x="214" y="363" font-size="22" font-weight="900" fill="#148ed5">NETWORKING FUNDAMENTALS</text><text x="214" y="386" font-size="14" font-weight="700" fill="#526a7e">What a network is and how data moves</text><text x="214" y="409" font-size="14.5" fill="#20384d">• PAN • LAN • MAN • WAN • Internet</text><text x="214" y="428" font-size="14.5" fill="#20384d">• OSI 7 layers and TCP/IP model</text><text x="214" y="447" font-size="14.5" fill="#20384d">• Ethernet • Wi-Fi • topologies • network media</text><text x="214" y="466" font-size="14.5" fill="#20384d">• Frames • packets • segments • encapsulation</text><text x="214" y="485" font-size="14.5" fill="#20384d">• MAC addresses • NICs • bandwidth • latency • jitter</text><rect x="1190" y="345" width="345" height="135" rx="10" fill="#e5eef7" stroke="#c6d7e5"/><text x="1208" y="373" font-size="14" font-weight="900" fill="#148ed5">TOOLS &amp; PRACTICE</text><text x="1208" y="398" font-size="13" fill="#263c50">LEARN: diagrams • packet-flow sketches</text><text x="1208" y="430" font-size="14" font-weight="900" fill="#17354c">LEARNING OUTCOME</text><text x="1208" y="454" font-size="13" fill="#263c50">explain host-to-host data flow</text></g><g><rect x="42" y="511" width="1516" height="165" rx="15" fill="#f4f8fc" stroke="#0aa99d" stroke-width="3"/><rect x="42" y="511" width="150" height="165" rx="14" fill="#0aa99d"/><text x="117" y="602" text-anchor="middle" font-size="50" font-weight="900" fill="#fff">02</text><text x="214" y="544" font-size="22" font-weight="900" fill="#0aa99d">COMMAND LINE &amp; NETWORKING TOOLS</text><text x="214" y="567" font-size="14" font-weight="700" fill="#526a7e">Observe, test and investigate real networks</text><text x="214" y="590" font-size="14.5" fill="#20384d">• ping • traceroute / tracert • ipconfig • ifconfig • ip</text><text x="214" y="609" font-size="14.5" fill="#20384d">• nslookup • dig • arp • route • netstat • ss</text><text x="214" y="628" font-size="14.5" fill="#20384d">• Wireshark • tcpdump • packet analysis</text><text x="214" y="647" font-size="14.5" fill="#20384d">• PuTTY / SSH • terminal basics • device access</text><text x="214" y="666" font-size="14.5" fill="#20384d">• Interface status • routing tables • command output</text><rect x="1190" y="526" width="345" height="135" rx="10" fill="#e5eef7" stroke="#c6d7e5"/><text x="1208" y="554" font-size="14" font-weight="900" fill="#0aa99d">TOOLS &amp; PRACTICE</text><text x="1208" y="579" font-size="13" fill="#263c50">PRACTISE: Windows • Linux • Wireshark</text><text x="1208" y="611" font-size="14" font-weight="900" fill="#17354c">LEARNING OUTCOME</text><text x="1208" y="635" font-size="13" fill="#263c50">diagnose basic connectivity</text></g><g><rect x="42" y="692" width="1516" height="165" rx="15" fill="#f4f8fc" stroke="#48a94c" stroke-width="3"/><rect x="42" y="692" width="150" height="165" rx="14" fill="#48a94c"/><text x="117" y="783" text-anchor="middle" font-size="50" font-weight="900" fill="#fff">03</text><text x="214" y="725" font-size="22" font-weight="900" fill="#48a94c">NETWORK DEVICES &amp; PHYSICAL INFRASTRUCTURE</text><text x="214" y="748" font-size="14" font-weight="700" fill="#526a7e">Know each building block and where it fits</text><text x="214" y="771" font-size="14.5" fill="#20384d">• Hubs • repeaters • bridges • Ethernet switches</text><text x="214" y="790" font-size="14.5" fill="#20384d">• Routers • wireless APs • controllers • modems / ONTs</text><text x="214" y="809" font-size="14.5" fill="#20384d">• Firewalls • load balancers • network appliances</text><text x="214" y="828" font-size="14.5" fill="#20384d">• Copper / fibre • connectors • optical transceivers</text><text x="214" y="847" font-size="14.5" fill="#20384d">• Racks • patch panels • PoE • UPS • power • cooling</text><rect x="1190" y="707" width="345" height="135" rx="10" fill="#e5eef7" stroke="#c6d7e5"/><text x="1208" y="735" font-size="14" font-weight="900" fill="#48a94c">TOOLS &amp; PRACTICE</text><text x="1208" y="760" font-size="13" fill="#263c50">EXPLORE: device roles • ports • cabling</text><text x="1208" y="792" font-size="14" font-weight="900" fill="#17354c">LEARNING OUTCOME</text><text x="1208" y="816" font-size="13" fill="#263c50">select devices for a topology</text></g><g><rect x="42" y="873" width="1516" height="165" rx="15" fill="#f4f8fc" stroke="#d6a51c" stroke-width="3"/><rect x="42" y="873" width="150" height="165" rx="14" fill="#d6a51c"/><text x="117" y="964" text-anchor="middle" font-size="50" font-weight="900" fill="#fff">04</text><text x="214" y="906" font-size="22" font-weight="900" fill="#d6a51c">IP ADDRESSING &amp; SUBNETTING</text><text x="214" y="929" font-size="14" font-weight="700" fill="#526a7e">Master the addressing plan behind routed networks</text><text x="214" y="952" font-size="14.5" fill="#20384d">• Binary • IPv4 • IPv6 • private and public addresses</text><text x="214" y="971" font-size="14.5" fill="#20384d">• Subnet masks • CIDR • network / host / broadcast</text><text x="214" y="990" font-size="14.5" fill="#20384d">• Subnetting • VLSM • FLSM • route summarisation</text><text x="214" y="1009" font-size="14.5" fill="#20384d">• Default gateways • static and dynamic addressing</text><text x="214" y="1028" font-size="14.5" fill="#20384d">• DHCP • DNS relationships • IPAM</text><rect x="1190" y="888" width="345" height="135" rx="10" fill="#e5eef7" stroke="#c6d7e5"/><text x="1208" y="916" font-size="14" font-weight="900" fill="#d6a51c">TOOLS &amp; PRACTICE</text><text x="1208" y="941" font-size="13" fill="#263c50">PRACTISE: subnet calculators • address plans</text><text x="1208" y="973" font-size="14" font-weight="900" fill="#17354c">LEARNING OUTCOME</text><text x="1208" y="997" font-size="13" fill="#263c50">design a scalable IP plan</text></g><g><rect x="42" y="1054" width="1516" height="165" rx="15" fill="#f4f8fc" stroke="#e58a26" stroke-width="3"/><rect x="42" y="1054" width="150" height="165" rx="14" fill="#e58a26"/><text x="117" y="1145" text-anchor="middle" font-size="50" font-weight="900" fill="#fff">05</text><text x="214" y="1087" font-size="22" font-weight="900" fill="#e58a26">SWITCHING, ROUTING &amp; NETWORK SERVICES</text><text x="214" y="1110" font-size="14" font-weight="700" fill="#526a7e">Connect networks and control traffic paths</text><text x="214" y="1133" font-size="14.5" fill="#20384d">• VLANs • access / trunk • 802.1Q • inter-VLAN routing</text><text x="214" y="1152" font-size="14.5" fill="#20384d">• STP / RSTP • EtherChannel / LACP • ARP / ND</text><text x="214" y="1171" font-size="14.5" fill="#20384d">• Routing tables • longest-prefix • static / default routes</text><text x="214" y="1190" font-size="14.5" fill="#20384d">• OSPF • BGP • EIGRP • ECMP • VRF • redistribution</text><text x="214" y="1209" font-size="14.5" fill="#20384d">• TCP / UDP • ICMP • DNS • DHCP • HTTP/S • TLS • SSH</text><rect x="1190" y="1069" width="345" height="135" rx="10" fill="#e5eef7" stroke="#c6d7e5"/><text x="1208" y="1097" font-size="14" font-weight="900" fill="#e58a26">TOOLS &amp; PRACTICE</text><text x="1208" y="1122" font-size="13" fill="#263c50">LAB: Cisco IOS concepts • GNS3 • EVE-NG</text><text x="1208" y="1154" font-size="14" font-weight="900" fill="#17354c">LEARNING OUTCOME</text><text x="1208" y="1178" font-size="13" fill="#263c50">explain end-to-end packet flow</text></g><g><rect x="42" y="1235" width="1516" height="165" rx="15" fill="#f4f8fc" stroke="#d84d53" stroke-width="3"/><rect x="42" y="1235" width="150" height="165" rx="14" fill="#d84d53"/><text x="117" y="1326" text-anchor="middle" font-size="50" font-weight="900" fill="#fff">06</text><text x="214" y="1268" font-size="22" font-weight="900" fill="#d84d53">NETWORK SECURITY &amp; ZERO TRUST</text><text x="214" y="1291" font-size="14" font-weight="700" fill="#526a7e">Protect identities, devices, applications and paths</text><text x="214" y="1314" font-size="14.5" fill="#20384d">• Security zones • segmentation • stateful firewalls • ACLs</text><text x="214" y="1333" font-size="14.5" fill="#20384d">• NAT / PAT • site-to-site / remote VPN • IPsec</text><text x="214" y="1352" font-size="14.5" fill="#20384d">• AAA • RADIUS / TACACS+ • 802.1X • NAC</text><text x="214" y="1371" font-size="14.5" fill="#20384d">• IDS / IPS • DDoS protection • threat visibility</text><text x="214" y="1390" font-size="14.5" fill="#20384d">• Zero Trust • ZTNA • least privilege • micro-segmentation</text><rect x="1190" y="1250" width="345" height="135" rx="10" fill="#e5eef7" stroke="#c6d7e5"/><text x="1208" y="1278" font-size="14" font-weight="900" fill="#d84d53">TOOLS &amp; PRACTICE</text><text x="1208" y="1303" font-size="13" fill="#263c50">LAB: pfSense / OPNsense • firewall • VPN</text><text x="1208" y="1335" font-size="14" font-weight="900" fill="#17354c">LEARNING OUTCOME</text><text x="1208" y="1359" font-size="13" fill="#263c50">design and justify access controls</text></g><g><rect x="42" y="1416" width="1516" height="165" rx="15" fill="#f4f8fc" stroke="#8255c7" stroke-width="3"/><rect x="42" y="1416" width="150" height="165" rx="14" fill="#8255c7"/><text x="117" y="1507" text-anchor="middle" font-size="50" font-weight="900" fill="#fff">07</text><text x="214" y="1449" font-size="22" font-weight="900" fill="#8255c7">WIRELESS NETWORKING &amp; TROUBLESHOOTING</text><text x="214" y="1472" font-size="14" font-weight="700" fill="#526a7e">Engineer reliable access and solve faults methodically</text><text x="214" y="1495" font-size="14.5" fill="#20384d">• 802.11 • 2.4 / 5 / 6 GHz • channels • RF basics</text><text x="214" y="1514" font-size="14.5" fill="#20384d">• SSID • authentication • roaming • controllers • AP design</text><text x="214" y="1533" font-size="14.5" fill="#20384d">• Coverage • interference • capacity • surveys • guest Wi-Fi</text><text x="214" y="1552" font-size="14.5" fill="#20384d">• Troubleshoot physical → link → IP → transport → app</text><text x="214" y="1571" font-size="14.5" fill="#20384d">• Ping • traceroute • logs • counters • packet captures</text><rect x="1190" y="1431" width="345" height="135" rx="10" fill="#e5eef7" stroke="#c6d7e5"/><text x="1208" y="1459" font-size="14" font-weight="900" fill="#8255c7">TOOLS &amp; PRACTICE</text><text x="1208" y="1484" font-size="13" fill="#263c50">TOOLS: Wi-Fi analyser • Wireshark • iperf</text><text x="1208" y="1516" font-size="14" font-weight="900" fill="#17354c">LEARNING OUTCOME</text><text x="1208" y="1540" font-size="13" fill="#263c50">isolate root cause with evidence</text></g><g><rect x="42" y="1597" width="1516" height="165" rx="15" fill="#f4f8fc" stroke="#1884d0" stroke-width="3"/><rect x="42" y="1597" width="150" height="165" rx="14" fill="#1884d0"/><text x="117" y="1688" text-anchor="middle" font-size="50" font-weight="900" fill="#fff">08</text><text x="214" y="1630" font-size="22" font-weight="900" fill="#1884d0">CLOUD &amp; HYBRID NETWORKING</text><text x="214" y="1653" font-size="14" font-weight="700" fill="#526a7e">Apply fundamentals to AWS, Azure and Google Cloud</text><text x="214" y="1676" font-size="14.5" fill="#20384d">• AWS VPC • Azure VNet • Google Cloud VPC</text><text x="214" y="1695" font-size="14.5" fill="#20384d">• Subnets • route tables • security groups / NSGs • firewalls</text><text x="214" y="1714" font-size="14.5" fill="#20384d">• Internet / NAT gateways • load balancers • DNS • private endpoints</text><text x="214" y="1733" font-size="14.5" fill="#20384d">• Peering • hub-and-spoke • transit gateways • segmentation</text><text x="214" y="1752" font-size="14.5" fill="#20384d">• VPN • Direct Connect • ExpressRoute • Cloud Interconnect</text><rect x="1190" y="1612" width="345" height="135" rx="10" fill="#e5eef7" stroke="#c6d7e5"/><text x="1208" y="1640" font-size="14" font-weight="900" fill="#1884d0">TOOLS &amp; PRACTICE</text><text x="1208" y="1665" font-size="13" fill="#263c50">BUILD: Terraform • flow logs • cloud diagrams</text><text x="1208" y="1697" font-size="14" font-weight="900" fill="#17354c">LEARNING OUTCOME</text><text x="1208" y="1721" font-size="13" fill="#263c50">connect on-prem, cloud and multi-cloud</text></g><g><rect x="42" y="1778" width="1516" height="165" rx="15" fill="#f4f8fc" stroke="#2871bd" stroke-width="3"/><rect x="42" y="1778" width="150" height="165" rx="14" fill="#2871bd"/><text x="117" y="1869" text-anchor="middle" font-size="50" font-weight="900" fill="#fff">09</text><text x="214" y="1811" font-size="22" font-weight="900" fill="#2871bd">DATA CENTRE, CONTAINERS &amp; ADVANCED CONNECTIVITY</text><text x="214" y="1834" font-size="14" font-weight="700" fill="#526a7e">Understand modern platforms and large-scale traffic</text><text x="214" y="1857" font-size="14.5" fill="#20384d">• Data centre: leaf-spine • VXLAN / EVPN • redundancy</text><text x="214" y="1876" font-size="14.5" fill="#20384d">• SD-WAN • SASE • MPLS • QoS • resilient WAN</text><text x="214" y="1895" font-size="14.5" fill="#20384d">• Docker networking • bridges • overlays • address spaces</text><text x="214" y="1914" font-size="14.5" fill="#20384d">• Kubernetes pods • Services • CNI • Ingress / Gateway API</text><text x="214" y="1933" font-size="14.5" fill="#20384d">• NetworkPolicy • service mesh • CDN • global traffic</text><rect x="1190" y="1793" width="345" height="135" rx="10" fill="#e5eef7" stroke="#c6d7e5"/><text x="1208" y="1821" font-size="14" font-weight="900" fill="#2871bd">TOOLS &amp; PRACTICE</text><text x="1208" y="1846" font-size="13" fill="#263c50">LAB: Linux bridges • Kubernetes • CNI</text><text x="1208" y="1878" font-size="14" font-weight="900" fill="#17354c">LEARNING OUTCOME</text><text x="1208" y="1902" font-size="13" fill="#263c50">trace traffic across clusters and regions</text></g><g><rect x="42" y="1959" width="1516" height="165" rx="15" fill="#f4f8fc" stroke="#168c78" stroke-width="3"/><rect x="42" y="1959" width="150" height="165" rx="14" fill="#168c78"/><text x="117" y="2050" text-anchor="middle" font-size="50" font-weight="900" fill="#fff">10</text><text x="214" y="1992" font-size="22" font-weight="900" fill="#168c78">OPERATIONS, AUTOMATION &amp; ENTERPRISE ARCHITECTURE</text><text x="214" y="2015" font-size="14" font-weight="700" fill="#526a7e">Move from device configuration to solution design</text><text x="214" y="2038" font-size="14.5" fill="#20384d">• SNMP • syslog • NetFlow / IPFIX • telemetry</text><text x="214" y="2057" font-size="14.5" fill="#20384d">• Wireshark • tcpdump • MTU / MSS • capacity analysis</text><text x="214" y="2076" font-size="14.5" fill="#20384d">• Ansible • APIs • Python • network Infrastructure as Code</text><text x="214" y="2095" font-size="14.5" fill="#20384d">• High availability • failover • DR • change management</text><text x="214" y="2114" font-size="14.5" fill="#20384d">• Requirements • HLD / LLD • diagrams • standards • trade-offs</text><rect x="1190" y="1974" width="345" height="135" rx="10" fill="#e5eef7" stroke="#c6d7e5"/><text x="1208" y="2002" font-size="14" font-weight="900" fill="#168c78">TOOLS &amp; PRACTICE</text><text x="1208" y="2027" font-size="13" fill="#263c50">BUILD: Git • Ansible • Terraform • Python • NMS</text><text x="1208" y="2059" font-size="14" font-weight="900" fill="#17354c">LEARNING OUTCOME</text><text x="1208" y="2083" font-size="13" fill="#263c50">deliver resilient enterprise designs</text></g>
<text x="70" y="2190" font-size="15" fill="#b5d9eb">TEACHING LOOP: EXPLAIN → DRAW THE FLOW → CONFIGURE A LAB → TEST → BREAK → TROUBLESHOOT → DOCUMENT</text>
</g></svg>