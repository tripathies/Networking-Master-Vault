<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
<title id="title">Network Architecture Playbook — Fundamentals, Devices and Enterprise Network Design</title>
<desc id="desc">A detailed vendor-neutral network architecture illustration covering OSI and TCP/IP, Ethernet and Wi-Fi, MAC addressing and encapsulation, hubs, bridges, switches, routers, wireless access points, modems and optical network terminals, firewalls, load balancers, NICs, copper and fibre cabling, optical transceivers, racks and power, campus LAN, branch WAN, data centre, cloud, segmentation, routing, network services and operations.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#041326"/><stop offset=".52" stop-color="#092744"/><stop offset="1" stop-color="#020914"/></linearGradient>
 <linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#61f0ff"/><stop offset=".5" stop-color="#19b9f2"/><stop offset="1" stop-color="#1262bc"/></linearGradient>
 <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#123b5d"/><stop offset="1" stop-color="#07172b"/></linearGradient>
 <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#687eff"/><stop offset="1" stop-color="#293c91"/></linearGradient>
 <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#24d7c4"/><stop offset="1" stop-color="#087e9c"/></linearGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#43a8d5" stroke-opacity=".14" stroke-width="1"/></pattern>
