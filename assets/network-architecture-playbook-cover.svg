<g class="body" text-anchor="middle">
 <text x="800" y="88" class="h" font-size="30" fill="#91eaff" letter-spacing="7">THE NETWORKING LEARNING SERIES</text>
 <text x="800" y="174" class="h" font-size="82" fill="#fff" filter="url(#shadow)">NETWORKING</text>
 <text x="800" y="248" class="h" font-size="64" fill="#49dfff">ZERO TO HERO</text>
 <text x="800" y="294" font-size="25" font-weight="700" fill="#d8efff">From First Packet to Enterprise &amp; Cloud Architecture</text>
 <rect x="475" y="318" width="650" height="48" rx="24" fill="#082c4b" stroke="#39dfff" stroke-width="2"/>
 <text x="800" y="349" font-size="18" font-weight="700" fill="#b8f3ff" letter-spacing="2">LEARN • DESIGN • CONFIGURE • TROUBLESHOOT</text>
</g>
